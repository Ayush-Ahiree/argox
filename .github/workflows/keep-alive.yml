name: Keep Render backend awake

# Render's free tier spins a web service down after 15 minutes without
# inbound traffic; the next request then takes ~30-60s to cold-start.
# Pinging every 10 minutes keeps it warm. GitHub cron can run a few
# minutes late, so 10 leaves headroom under the 15-minute cutoff.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://argox-cflf.onrender.com/health
